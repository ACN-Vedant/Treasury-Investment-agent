<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasury Investment AI - Claude Powered</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface2: #1a2233;
    --border: #1e2d42;
    --accent: #00d4ff;
    --green: #00e5a0;
    --red: #ff4d6a;
    --purple: #b388ff;
    --text: #e2eaf4;
    --muted: #607080;
    --mono: 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
  }

  .header h1 {
    color: var(--accent);
    margin-bottom: 5px;
    font-size: 24px;
  }

  .header p {
    color: var(--muted);
    font-size: 13px;
  }

  .form-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .form-title {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 15px;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 15px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  .button-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    padding: 12px 24px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  button:hover:not(:disabled) {
    background: #00eeff;
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  button.secondary:hover:not(:disabled) {
    background: var(--border);
  }

  .output-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
  }

  .output-section.visible {
    display: block;
  }

  .output-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  .status-dot.error {
    background: var(--red);
    animation: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .output-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
  }

  .analysis-result {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    max-height: 500px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .step-box {
    background: var(--bg);
    border-left: 3px solid var(--accent);
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 4px;
  }

  .step-title {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .step-content {
    color: var(--text);
    font-size: 12px;
    line-height: 1.5;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    padding: 10px 16px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--sans);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }

  .tab-btn:hover {
    color: var(--text);
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error {
    background: rgba(255, 77, 106, 0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 15px;
  }

  .success {
    background: rgba(0, 229, 160, 0.1);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
  }

  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .button-group { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Treasury Investment AI</h1>
    <p>Claude-Powered Analysis Engine | Real-Time Investment Recommendations</p>
  </div>

  <div class="form-section">
    <div class="form-title">Configuration</div>

    <div class="grid">
      <div class="form-group">
        <label>Claude API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." value="">
      </div>

      <div class="form-group">
        <label>Analysis Type</label>
        <select id="analysisType" style="width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-family: var(--mono);">
          <option value="sample">Sample Treasury Data (Demo)</option>
          <option value="custom">Custom Data (JSON)</option>
        </select>
      </div>
    </div>

    <div id="customDataSection" style="display: none;">
      <div class="form-group">
        <label>Cash Balances (JSON)</label>
        <textarea id="cashBalancesInput" rows="4" placeholder='[{"account_id":"ACC-001","available_balance":16700000}]'></textarea>
      </div>

      <div class="form-group">
        <label>Loan Schedule (JSON)</label>
        <textarea id="loanScheduleInput" rows="4" placeholder='[{"loan_id":"LN-001","principal_due":2500000}]'></textarea>
      </div>

      <div class="form-group">
        <label>Investment Positions (JSON)</label>
        <textarea id="investmentInput" rows="4" placeholder='[{"position_id":"POS-001","notional_amount":2000000}]'></textarea>
      </div>
    </div>

    <div class="form-group">
      <label>Margin Haircut (%)</label>
      <input type="number" id="haircut" min="0" max="100" step="0.1" value="5">
    </div>

    <div class="button-group">
      <button onclick="runAnalysis()">▶ Run Analysis Pipeline</button>
      <button class="secondary" onclick="loadSampleData()">📊 Load Sample Data</button>
    </div>
  </div>

  <div class="output-section" id="outputSection">
    <div class="output-header">
      <div class="status-dot" id="statusDot"></div>
      <div class="output-title">Analysis Results</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
      <button class="tab-btn" onclick="switchTab('step1')">Step 1: Reporting</button>
      <button class="tab-btn" onclick="switchTab('step2')">Step 2: Ratings</button>
      <button class="tab-btn" onclick="switchTab('step3')">Step 3: Compliance</button>
      <button class="tab-btn" onclick="switchTab('step4')">Step 4: Opportunity</button>
      <button class="tab-btn" onclick="switchTab('raw')">Raw Output</button>
    </div>

    <div id="overviewTab" class="tab-content active">
      <div id="overviewContent"></div>
    </div>

    <div id="step1Tab" class="tab-content">
      <div id="step1Content"></div>
    </div>

    <div id="step2Tab" class="tab-content">
      <div id="step2Content"></div>
    </div>

    <div id="step3Tab" class="tab-content">
      <div id="step3Content"></div>
    </div>

    <div id="step4Tab" class="tab-content">
      <div id="step4Content"></div>
    </div>

    <div id="rawTab" class="tab-content">
      <div class="analysis-result" id="rawOutput"></div>
    </div>
  </div>
</div>

<script>
const SAMPLE_DATA = {
  cashBalances: [
    { account_id: "ACC-001", account_name: "Main Operating", bank_name: "Barclays", currency: "GBP", available_balance: 8500000, ledger_balance: 8500000, gross_surplus: 7500000 },
    { account_id: "ACC-002", account_name: "USD Treasury", bank_name: "JPMorgan", currency: "USD", available_balance: 15200000, ledger_balance: 15200000, gross_surplus: 13200000 },
    { account_id: "ACC-003", account_name: "EUR Liquidity", bank_name: "Deutsche Bank", currency: "EUR", available_balance: 6300000, ledger_balance: 6300000, gross_surplus: 5500000 }
  ],
  loanSchedule: [
    { loan_id: "LN-001", account_id: "ACC-001", lender: "Barclays", outstanding_principal: 5000000, rate: 4.5, due_date: "30/06/2026", principal_due: 2500000, interest_due: 112500 },
    { loan_id: "LN-002", account_id: "ACC-002", lender: "JPMorgan", outstanding_principal: 8000000, rate: 5.2, due_date: "15/09/2026", principal_due: 2000000, interest_due: 104000 },
    { loan_id: "LN-003", account_id: "ACC-003", lender: "Deutsche Bank", outstanding_principal: 3000000, rate: 3.8, due_date: "01/06/2027", principal_due: 1000000, interest_due: 114000 }
  ],
  investmentPositions: [
    { position_id: "POS-001", counterparty: "Barclays", notional: 2000000, maturity: "01/07/2026", tenor_days: 122, yield_pct: 5.1, rating: "AA-" },
    { position_id: "POS-002", counterparty: "JPMorgan", notional: 3500000, maturity: "15/08/2026", tenor_days: 181, yield_pct: 5.35, rating: "AAA" },
    { position_id: "POS-003", counterparty: "BNP Paribas", notional: 1500000, maturity: "01/10/2026", tenor_days: 183, yield_pct: 3.9, rating: "AA+" }
  ]
};

let analysisState = {
  step1: null,
  step2: null,
  step3: null,
  step4: null
};

document.getElementById('analysisType').addEventListener('change', (e) => {
  document.getElementById('customDataSection').style.display = e.target.value === 'custom' ? 'block' : 'none';
});

function loadSampleData() {
  document.getElementById('analysisType').value = 'sample';
  document.getElementById('customDataSection').style.display = 'none';
  document.getElementById('apiKey').focus();
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabName + 'Tab').classList.add('active');
  event.target.classList.add('active');
}

async function runAnalysis() {
  const apiKey = document.getElementById('apiKey').value;
  if (!apiKey) {
    showError('Please enter your Claude API key');
    return;
  }

  const analysisType = document.getElementById('analysisType').value;
  let data;

  if (analysisType === 'sample') {
    data = SAMPLE_DATA;
  } else {
    try {
      data = {
        cashBalances: JSON.parse(document.getElementById('cashBalancesInput').value),
        loanSchedule: JSON.parse(document.getElementById('loanScheduleInput').value),
        investmentPositions: JSON.parse(document.getElementById('investmentInput').value)
      };
    } catch (e) {
      showError('Invalid JSON in custom data: ' + e.message);
      return;
    }
  }

  const haircut = parseFloat(document.getElementById('haircut').value) || 5;

  showLoading();

  try {
    // Step 1: Reporting Agent
    const step1Result = await callClaude(apiKey, generateStep1Prompt(data, haircut));
    analysisState.step1 = step1Result;
    displayStep(1, step1Result);

    // Step 2: Ratings Agent
    const step2Result = await callClaude(apiKey, generateStep2Prompt(data));
    analysisState.step2 = step2Result;
    displayStep(2, step2Result);

    // Step 3: Compliance Agent
    const step3Result = await callClaude(apiKey, generateStep3Prompt(data));
    analysisState.step3 = step3Result;
    displayStep(3, step3Result);

    // Step 4: Opportunity Agent
    const step4Result = await callClaude(apiKey, generateStep4Prompt(data, haircut, analysisState.step1));
    analysisState.step4 = step4Result;
    displayStep(4, step4Result);

    showSuccess('Analysis Complete!');
    displayOverview();
  } catch (error) {
    showError('Analysis failed: ' + error.message);
  }
}

async function callClaude(apiKey, prompt) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-1',
      max_tokens: 2000,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error?.message || 'API error');
  }

  const data = await response.json();
  return data.content[0].text;
}

function generateStep1Prompt(data, haircut) {
  return `You are a Treasury Reporting Agent. Analyze this treasury data and provide a surplus analysis.

CASH BALANCES:
${JSON.stringify(data.cashBalances, null, 2)}

LOAN SCHEDULE (obligations within 180 days):
${JSON.stringify(data.loanSchedule, null, 2)}

INVESTMENT POSITIONS (maturing within 180 days):
${JSON.stringify(data.investmentPositions, null, 2)}

Fixed Margin Haircut: ${haircut}%

Provide:
1. Net investable surplus per account (Available Balance + Maturing Investments - Loan Obligations - Haircut)
2. Summary of findings
3. Accounts recommended for investment

Be concise and structured.`;
}

function generateStep2Prompt(data) {
  return `You are a Ratings Agent. Evaluate the credit ratings of counterparties in these investment positions:

${JSON.stringify(data.investmentPositions, null, 2)}

Policy minimum rating: A-

For each counterparty:
1. State their current rating
2. Check if they meet the A- minimum
3. Assess credit quality

Provide a concise ratings summary.`;
}

function generateStep3Prompt(data) {
  return `You are a Compliance Agent. Check if these investments comply with policy:

${JSON.stringify(data.investmentPositions, null, 2)}

Policy rules:
- Max tenor: 180 days
- Min rating: A-
- Approved products: Fixed Deposit, Treasury Bill, Commercial Paper

For each position:
1. Check tenor compliance
2. Check rating compliance
3. Confirm product is approved

Provide compliance status: COMPLIANT or NON-COMPLIANT.`;
}

function generateStep4Prompt(data, haircut, step1Output) {
  return `You are an Opportunity Agent. Based on the surplus analysis, recommend investments.

Treasury data: ${JSON.stringify(data, null, 2)}

Surplus analysis: ${step1Output}

Margin haircut applied: ${haircut}%

Provide:
1. Top 3 investment recommendations
2. Recommended amounts per account
3. Expected yields vs overnight rate
4. Risk assessment

Keep recommendations actionable and specific.`;
}

function displayStep(stepNum, content) {
  const tabId = 'step' + stepNum + 'Content';
  document.getElementById(tabId).innerHTML = `<div class="analysis-result">${escapeHtml(content)}</div>`;
}

function displayOverview() {
  const content = `
<div class="success">Analysis Complete - All Steps Executed</div>

<div class="step-box">
  <div class="step-title">Step 1: Treasury Reporting</div>
  <div class="step-content">${analysisState.step1 ? analysisState.step1.substring(0, 300) + '...' : 'Pending'}</div>
</div>

<div class="step-box">
  <div class="step-title">Step 2: Credit Ratings</div>
  <div class="step-content">${analysisState.step2 ? analysisState.step2.substring(0, 300) + '...' : 'Pending'}</div>
</div>

<div class="step-box">
  <div class="step-title">Step 3: Compliance Check</div>
  <div class="step-content">${analysisState.step3 ? analysisState.step3.substring(0, 300) + '...' : 'Pending'}</div>
</div>

<div class="step-box">
  <div class="step-title">Step 4: Investment Opportunities</div>
  <div class="step-content">${analysisState.step4 ? analysisState.step4.substring(0, 300) + '...' : 'Pending'}</div>
</div>

<p style="margin-top: 20px; color: var(--muted); font-size: 12px;">Click on individual tabs to see full analysis for each step.</p>
  `;

  document.getElementById('overviewContent').innerHTML = content;
}

function showLoading() {
  const section = document.getElementById('outputSection');
  section.classList.add('visible');
  section.innerHTML = `
    <div style="text-align: center; padding: 40px;">
      <div class="spinner"></div>
      <p style="color: var(--muted); margin-top: 15px;">Running analysis pipeline...</p>
      <p style="color: var(--muted); font-size: 12px; margin-top: 10px;">Steps: Reporting → Ratings → Compliance → Opportunity</p>
    </div>
  `;
  document.getElementById('statusDot').classList.add('active');
}

function showSuccess(message) {
  // Status already shows success, just update raw output
  const allOutput = `STEP 1: ${analysisState.step1}\n\nSTEP 2: ${analysisState.step2}\n\nSTEP 3: ${analysisState.step3}\n\nSTEP 4: ${analysisState.step4}`;
  document.getElementById('rawOutput').textContent = allOutput;
}

function showError(message) {
  const section = document.getElementById('outputSection');
  section.classList.add('visible');
  section.innerHTML = `<div class="error">${message}</div>`;
  document.getElementById('statusDot').classList.add('error');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
